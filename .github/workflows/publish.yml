name: "@gayansandamal/planning-poker-minimal"

on:
  push:
    branches:
      - main
  pull_request:

# One deploy at a time; a newer push to main replaces a queued one.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && 'deploy' || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Lint, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Lint
        run: yarn lint --no-fix

      - name: Unit tests
        run: yarn test:unit

      - name: Build application
        run: yarn build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # Read-only against Firestore: no test creates or changes a game.
      - name: End-to-end tests
        run: yarn test:e2e
        env:
          CI: "true"

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      # Deploy ships exactly this tested build.
      - name: Upload build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 1

  deploy:
    name: Deploy to Firebase
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download tested build
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Deploy to Firebase Hosting
        run: |
          if [ -z "$FIREBASE_PROJECT" ]; then
            echo "::error::FIREBASE_PROJECT secret is not set. Add your Firebase project ID in repo Settings → Secrets and variables → Actions."
            exit 1
          fi
          npx --yes firebase-tools@15.8.0 deploy --only hosting --non-interactive --project "$FIREBASE_PROJECT"
        env:
          FIREBASE_PROJECT: ${{ secrets.FIREBASE_PROJECT }}

      # Calls the Firebase Rules API directly instead of `firebase deploy`,
      # which first checks Service Usage (a role the CI account lacks).
      # Separate step so a rules failure can't block hosting deploys.
      - name: Deploy Firestore security rules
        run: |
          set -euo pipefail
          TOKEN=$(gcloud auth print-access-token)
          API="https://firebaserules.googleapis.com/v1/projects/$FIREBASE_PROJECT"
          RULESET=$(jq -Rs '{source: {files: [{name: "firestore.rules", content: .}]}}' firestore.rules \
            | curl -sS --fail-with-body -X POST "$API/rulesets" \
                -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" -d @- \
            | jq -r .name)
          echo "Created ruleset $RULESET"
          jq -n --arg rel "projects/$FIREBASE_PROJECT/releases/cloud.firestore" --arg rs "$RULESET" \
              '{release: {name: $rel, rulesetName: $rs}}' \
            | curl -sS --fail-with-body -X PATCH "$API/releases/cloud.firestore" \
                -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" -d @-
          echo "Released $RULESET to cloud.firestore"
        env:
          FIREBASE_PROJECT: ${{ secrets.FIREBASE_PROJECT }}
